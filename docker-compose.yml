name: slopcad

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    # No host port published: a reverse proxy on the compose network targets
    # the container's port 3001 directly (Dokploy Domains → service `web`,
    # port 3001). To poke the stack from your host, add a
    # docker-compose.override.yml with a `127.0.0.1:<port>:3001` mapping.
    environment:
      # Interpolation reads the host environment or a .env next to this file.
      # BETTER_AUTH_URL must be the public origin — it is better-auth's baseURL
      # and trusted origin. The startup command below refuses to run without a
      # BETTER_AUTH_SECRET (min 32 chars: openssl rand -base64 32) — the
      # production bundle cannot check it itself, because the build bakes in
      # SKIP_ENV_VALIDATION=1.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-file:/data/local.db}
    volumes:
      - slopcad-data:/data
    # Migrations run at every start (idempotent, journal-tracked) before the
    # server; the secret guard fails the container in seconds with a clear
    # message; exec hands PID 1 to the server so signals reach it.
    command:
      [
        "sh",
        "-c",
        ': "$${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32) in the environment or a .env next to docker-compose.yml}" && node scripts/migrate-prod.mjs && exec node .output/server/index.mjs',
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  slopcad-data:
